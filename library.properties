name=Model Railroad Animation
version=0.2.0
author=Josh McDannel
maintainer=Josh McDannel (https://github.com/jmcdannel)
sentence=Lighting, motion and sound effects for model railroads: welder, fire, TV, lightning, crossings, traffic lights, neon, fluorescent, beacons, day-night.
paragraph=Each effect is a small non-blocking module with begin() and update(now, on), so it runs alone or alongside others on one Arduino Nano. Every effect can start at power-up, while a pin is triggered (DEJA.js IO pin, relay, sensor), or toggle from a button.
category=Device Control
url=https://github.com/jmcdannel/model-railroad-arduino-animation-lib
architectures=avr
depends=Servo
includes=ModelRailroadAnimation.h
