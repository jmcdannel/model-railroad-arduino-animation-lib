# 🛠️ arduino-cli + cores + libraries, pinned by version and SHA-256.
# Shared by ci.yml and pages.yml so both build with exactly the same tools.
name: Set up arduino-cli
description: Install a checksum-verified arduino-cli, the AVR core (and optionally ESP32) and the libraries the sketches use
inputs:
  esp32:
    description: Also install the ESP32 core (large; only the ESP32 job needs it)
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ARDUINO_CLI_VERSION: 1.5.1
        ARDUINO_CLI_SHA256: 28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b
        AVR_CORE: arduino:avr@1.8.6
        ESP32_CORE: esp32:esp32@3.3.8
        ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        WANT_ESP32: ${{ inputs.esp32 }}
        # 📚 Servo: keep in sync with library.properties depends=. The rest are
        # for the standalone tools (speedometer…), named in each sketch.
        LIBRARIES: >-
          Servo@1.3.0
          TM1637@1.2.0
          SSD1306Ascii@1.3.5
          PubSubClient@2.8
          "Adafruit PWM Servo Driver Library@3.0.3"
          ArduinoJson@7.4.3
          "Adafruit GFX Library@1.12.6"
          "Adafruit ST7735 and ST7789 Library@1.11.0"
          "Adafruit SSD1306@2.5.17"
          U8g2_for_Adafruit_GFX@1.8.0
      run: |
        curl -sSfLo cli.tgz "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
        echo "${ARDUINO_CLI_SHA256}  cli.tgz" | sha256sum -c -
        tar -xzf cli.tgz arduino-cli && sudo mv arduino-cli /usr/local/bin/ && rm cli.tgz
        if [ "$WANT_ESP32" = true ]; then
          arduino-cli config init --overwrite >/dev/null
          arduino-cli config add board_manager.additional_urls "$ESP32_INDEX"
        fi
        arduino-cli core update-index
        arduino-cli core install "$AVR_CORE"
        if [ "$WANT_ESP32" = true ]; then arduino-cli core install "$ESP32_CORE"; fi
        eval "arduino-cli lib install $LIBRARIES"   # eval: one name has spaces
