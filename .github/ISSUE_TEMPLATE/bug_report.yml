name: 🐛 Bug report
description: An effect doesn't compile, doesn't run, or looks wrong
labels: [bug]
body:
  - type: input
    id: effect
    attributes:
      label: Which effect?
      placeholder: e.g. welder, crossing
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board
      placeholder: e.g. Arduino Nano (old bootloader), Nano clone with CH340
    validations:
      required: true
  - type: textarea
    id: wiring
    attributes:
      label: Wiring and settings
      description: Which pins, resistors, trigger wiring, and any tuning constants you changed.
  - type: textarea
    id: output
    attributes:
      label: Compiler or Serial Monitor output
      description: Paste it here. 🔐 Remove any WiFi passwords or IP addresses first.
      render: text
