# 🚦 Required checks for every PR into main (see the "main" ruleset).
# Third-party code is pinned: actions by commit SHA, tools by version + SHA-256.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 🕰️ scan every commit, not just the last one
          persist-credentials: false

      - name: 🔐 Install gitleaks
        run: |
          curl -sSfLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz

      - name: 🔍 Scan full history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner -v .

  compile:
    name: Compile sketches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-arduino

      - name: 🧪 Compile every sketch for the Nano (against this repo's src/)
        run: node tools/compile-sketches.mjs --board arduino:avr --summary "$GITHUB_STEP_SUMMARY"

      - name: 🧬 Web schema is up to date with src/
        run: node tools/gen-schema.mjs --check

      - name: 🧪 Web unit tests (generator, settings block, flasher)
        run: node --test test/*.test.mjs

      - name: 🏗️ Build the installer firmwares
        run: |
          node tools/build-firmware.mjs build/firmware --compile | tee firmware.txt
          { echo; echo "## 🌐 Installer firmwares"; echo; sed 's/^/- /' firmware.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔍 Firmwares and web page agree byte for byte
        run: node tools/check-firmware.mjs build/firmware

  # 📡 ESP32 builds (speedometer + MQTT, room sign…). Not a required check:
  # the ESP32 core is a big download, so it's cached and kept off the fast path.
  compile-esp32:
    name: Compile ESP32 sketches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ hashFiles('.github/actions/setup-arduino/action.yml') }}

      - uses: ./.github/actions/setup-arduino
        with:
          esp32: 'true'

      - name: 🧪 Compile every ESP32 build
        run: node tools/compile-sketches.mjs --board esp32 --summary "$GITHUB_STEP_SUMMARY"
