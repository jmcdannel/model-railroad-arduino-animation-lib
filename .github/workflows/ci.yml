# 🚦 Required checks for every PR into main (see the "main" ruleset).
# Third-party code is pinned: actions by commit SHA, tools by version + SHA-256.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 🕰️ scan every commit, not just the last one
          persist-credentials: false

      - name: 🔐 Install gitleaks
        run: |
          curl -sSfLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz

      - name: 🔍 Scan full history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner -v .

  compile:
    name: Compile sketches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FQBN: arduino:avr:nano
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-arduino

      - name: 🧪 Compile every example for the Nano (against this repo's src/)
        run: |
          {
            echo "## 📏 Sketch sizes (Arduino Nano: 30,720 B flash, 2,048 B RAM)"
            echo
            echo "| Sketch | Flash | RAM |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          for ino in $(git ls-files '*.ino'); do
            dir=$(dirname "$ino")
            echo "::group::$dir"
            if out=$(arduino-cli compile --fqbn "$FQBN" --library "$GITHUB_WORKSPACE" --warnings default "$dir" 2>&1); then
              echo "$out"
              flash=$(echo "$out" | sed -nE 's/^Sketch uses ([0-9]+) bytes \(([0-9]+)%\).*/\1 B (\2%)/p')
              ram=$(echo "$out" | sed -nE 's/^Global variables use ([0-9]+) bytes \(([0-9]+)%\).*/\1 B (\2%)/p')
              echo "| \`$dir\` | $flash | $ram |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$out"
              echo "::error file=$ino::$dir failed to compile"
              echo "| \`$dir\` | ❌ failed | |" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: 🧬 Web schema is up to date with src/
        run: node tools/gen-schema.mjs --check

      - name: 🧪 Web unit tests (generator, settings block, flasher)
        run: node --test test/*.test.mjs

      - name: 🏗️ Build the installer firmwares
        run: |
          node tools/build-firmware.mjs build/firmware --compile | tee firmware.txt
          { echo; echo "## 🌐 Installer firmwares"; echo; sed 's/^/- /' firmware.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔍 Firmwares and web page agree byte for byte
        run: node tools/check-firmware.mjs build/firmware
