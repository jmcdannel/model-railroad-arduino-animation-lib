<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout Effects</title>
  <meta name="description" content="Pick model railroad effects, get a lettered parts list and step-by-step wiring for an Arduino Nano, then install it from the browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='1.5' y='1.5' width='23' height='23' rx='3' fill='%23f2b705' stroke='%23141414' stroke-width='2'/%3E%3Cpath d='M7 19V7m0 12h6M15 7h5m-5 6h4m-4 6h5M15 7v12' stroke='%23141414' stroke-width='2' fill='none'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#sheet">Skip to the current step</a>
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1.5" y="1.5" width="23" height="23" rx="3" fill="#f2b705" stroke="#141414" stroke-width="2"/><path d="M7 19V7m0 12h6M15 7h5m-5 6h4m-4 6h5M15 7v12" stroke="#141414" stroke-width="2" fill="none"/></svg>
      Layout Effects
    </div>
    <label class="board-name"><span>Board</span><input id="board-name" type="text" maxlength="40" autocomplete="off" spellcheck="false"></label>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
  </header>

  <div class="body">
    <main id="sheet" tabindex="-1"></main>
    <aside id="nano" aria-labelledby="nano-title"></aside>
  </div>

  <p id="announcer" class="visually-hidden" aria-live="polite"></p>
  <noscript><p class="noscript">This page needs JavaScript to build your wiring sheet. The same effects, with wiring guides, are in the <a href="https://github.com/jmcdannel/model-railroad-arduino-animation-lib">GitHub repository</a>.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
